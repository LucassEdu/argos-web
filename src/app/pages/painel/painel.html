<div class="painel">
  <header class="faixa">
    <div class="interno">
      <div class="faixa__topo">
        <div class="marca">
          <img src="argos-a.png" alt="" />
          <span>Argos</span>
        </div>

        <div class="acoes">
          <button
            class="icone-botao"
            type="button"
            [attr.aria-label]="tema.escuro() ? 'Ativar modo claro' : 'Ativar modo noturno'"
            (click)="tema.alternar()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              @if (tema.escuro()) {
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              } @else {
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
              }
            </svg>
          </button>

          <app-sino (irParaVencimentos)="selecionar('vencimentos')" />

          <button
            class="avatar"
            type="button"
            [attr.title]="auth.usuario()?.nome"
            aria-label="Abrir meu perfil"
            (click)="selecionar('perfil')"
          >
            @if (auth.usuario()?.foto; as foto) {
              <img [src]="foto" alt="" />
            } @else {
              {{ iniciais() }}
            }
          </button>

          <button class="sair" type="button" (click)="auth.sair()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </div>

      <div class="faixa__saudacao">
        <h1>{{ saudacao() }}, {{ primeiroNome() }}</h1>
        <p>
          {{ auth.usuario()?.workspaceNome }}
          <span class="separador" aria-hidden="true"></span>
          {{ auth.ehAdmin() ? 'Administrador' : 'Membro' }}
        </p>
      </div>
    </div>
  </header>

  <div class="interno miolo">
    <nav class="abas" aria-label="Seções do painel">
      @for (aba of abas; track aba.id) {
        <button
          type="button"
          class="aba"
          [class.aba--ativa]="abaAtiva() === aba.id"
          [attr.aria-current]="abaAtiva() === aba.id ? 'page' : null"
          (click)="selecionar(aba.id)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            @switch (aba.id) {
              @case ('contas') {
                <rect x="2" y="5" width="20" height="14" rx="2" />
                <path d="M2 10h20" />
              }
              @case ('graficos') {
                <path d="M3 3v18h18" />
                <path d="M8 17v-5M13 17V8M18 17v-9" />
              }
              @case ('vencimentos') {
                <rect x="3" y="4" width="18" height="17" rx="2" />
                <path d="M8 2v4M16 2v4M3 10h18" />
              }
              @case ('perfil') {
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c1-4 4-6 8-6s7 2 8 6" />
              }
            }
          </svg>
          <span class="aba__longo">{{ aba.titulo }}</span>
          <span class="aba__curto">{{ aba.curto }}</span>
        </button>
      }
    </nav>

    <section>
      @switch (abaAtiva()) {
        @case ('contas') {
          <app-aba-contas />
        }
        @case ('graficos') {
          <app-aba-graficos />
        }
        @case ('vencimentos') {
          <app-aba-vencimentos />
        }
        @case ('perfil') {
          <app-aba-perfil />
        }
      }
    </section>
  </div>
</div>
