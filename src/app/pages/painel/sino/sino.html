<div class="sino">
  <button class="sino__botao" type="button" aria-label="Notificações" (click)="alternar()">
    <svg class="sino__icone" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.7 21a2 2 0 0 1-3.4 0" />
    </svg>
    @if (naoLidas().length > 0) {
      <span class="sino__badge">{{ rotuloBadge() }}</span>
    }
  </button>

  @if (aberto()) {
    <div class="sino__fundo" (click)="fechar()"></div>

    <div class="sino__painel">
      <header class="sino__topo">
        <strong>Notificações</strong>
        <small>{{ resumo() }}</small>
      </header>

      @if (falhou()) {
        <p class="sino__vazio">Não foi possível carregar as notificações.</p>
      } @else if (ordenadas().length === 0) {
        <p class="sino__vazio">Nenhuma notificação por enquanto.</p>
      } @else {
        <ul class="sino__lista">
          @for (n of ordenadas(); track n.id) {
            <li>
              <button
                type="button"
                class="item"
                [class.item--nova]="!n.lida"
                (click)="abrir(n)"
              >
                <span class="item__ponto"></span>
                <span class="item__texto">
                  <span class="item__mensagem">{{ n.mensagem }}</span>
                  <small class="item__data">{{ quando(n.criadoEm) }}</small>
                </span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
